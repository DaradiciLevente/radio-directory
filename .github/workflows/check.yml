name: Verificare Stare Streamuri Radio

on:
  schedule:
    - cron: '0 * * * *' # Rulează la fiecare oră, fix la minutul 0
  workflow_dispatch: # Permite și rularea manuală din tab-ul Actions

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Preluare cod repository
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rulare script verificare
        run: python check_streams.py

      - name: Commit și Salvare modificări dacă starea s-a schimbat
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git commit -am "🤖 Actualizare automată orară a stării streamurilor" || exit 0
          git push
