name: Handle Radio Proposal

on:
  repository_dispatch:
    types: [radio_proposal]

jobs:
  create_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create JSON proposal file
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          DATA_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          # Extragem ID-ul din payload folosind python sau jq
          RADIO_ID=$(echo "$DATA_PAYLOAD" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', 'unknown'))")
          
          # Creăm directorul proposals dacă nu există
          mkdir -p proposals
          
          # Salvăm conținutul primit în fișierul JSON
          echo "$DATA_PAYLOAD" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          # Asigurăm formatul curat
          print(json.dumps(data, indent=2, ensure_ascii=False))
          " > "proposals/${RADIO_ID}.json"

          # Facem commit și push folosind tokenul secret
          git config --global user.name "Radio Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          git add "proposals/${RADIO_ID}.json"
          git commit -m "Propunere nouă post radio: ${RADIO_ID}"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin main
